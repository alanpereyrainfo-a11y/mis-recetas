<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<title>Mis Recetas · Alan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --bg2:#0d1428; --panel:#0f1830; --panel2:#131f3d;
  --gold:#d4af37; --gold2:#f3d98b; --brass:#b08d57; --dim:#8a7a55;
  --ink:#ece4cf; --muted:#a59f8f; --line:rgba(212,175,55,.35);
  --display:"Poiret One","Didot","Bodoni 72","Futura","Century Gothic","Avenir Next",serif;
  --body:"Josefin Sans","Futura","Avenir Next","Century Gothic","Segoe UI",system-ui,sans-serif;
  --r:4px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;line-height:1.45;min-height:100vh;
  background-image:
    radial-gradient(ellipse at 50% -10%,rgba(212,175,55,.13),transparent 60%),
    repeating-linear-gradient(45deg,rgba(212,175,55,.025) 0 1px,transparent 1px 22px),
    repeating-linear-gradient(-45deg,rgba(212,175,55,.025) 0 1px,transparent 1px 22px);
  background-attachment:fixed}
a{color:inherit}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Header ---------- */
header.hero{position:relative;overflow:hidden;text-align:center;padding:42px 18px 26px;border-bottom:1px solid var(--line)}
.sun{position:absolute;left:50%;top:100%;width:900px;height:900px;transform:translate(-50%,-50%);pointer-events:none;opacity:.55}
.sun svg{width:100%;height:100%;animation:spin 140s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .crest{width:74px;height:46px;margin:0 auto 10px;display:block}
.crest path,.crest line{stroke:var(--gold);fill:none;stroke-width:1.2;stroke-dasharray:240;stroke-dashoffset:240;animation:draw 2.2s .2s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.hero h1{position:relative;margin:0;font-family:var(--display);font-weight:400;font-size:clamp(2.4rem,11vw,4.6rem);letter-spacing:.08em;line-height:1;
  background:linear-gradient(100deg,var(--brass) 0%,var(--gold2) 22%,var(--gold) 40%,#fff6d6 50%,var(--gold) 60%,var(--gold2) 78%,var(--brass) 100%);
  background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s ease-in-out infinite, rise 1s ease both}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
@keyframes rise{from{opacity:0;transform:translateY(14px);letter-spacing:.3em}to{opacity:1;transform:none}}
.hero .sub{position:relative;margin:10px 0 0;font-size:.78rem;letter-spacing:.42em;text-transform:uppercase;color:var(--brass);animation:rise 1s .3s ease both}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:16px auto 0;max-width:320px;position:relative;animation:rise 1s .5s ease both}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{transform:scaleX(-1)}
.rule i{width:9px;height:9px;border:1px solid var(--gold);transform:rotate(45deg)}
.stats{position:relative;display:flex;justify-content:center;gap:22px;margin-top:16px;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);animation:rise 1s .7s ease both}
.stats b{display:block;font-family:var(--display);font-size:1.6rem;color:var(--gold2);font-weight:400;letter-spacing:.05em}

/* ---------- Toolbar ---------- */
.bar{position:sticky;top:0;z-index:20;background:rgba(7,11,22,.86);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px 8px;padding-top:max(10px,env(safe-area-inset-top))}
.wrap{max-width:1180px;margin:0 auto}
.search{position:relative}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;font-size:16px;padding:12px 40px 11px 42px;border-radius:var(--r);outline:none;transition:border-color .25s,box-shadow .25s}
.search input::placeholder{color:#7d7766}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15),0 0 22px rgba(212,175,55,.15)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--gold);fill:none;stroke-width:1.5}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;color:var(--brass);font-size:1.3rem;cursor:pointer;display:none}
.search.has .clear{display:block}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.tab{position:relative;z-index:1;background:none;border:0;padding:10px 4px 9px;cursor:pointer;font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:color .3s}
.tab + .tab{border-left:1px solid var(--line)}
.tab .n{font-size:.7rem;letter-spacing:.05em;opacity:.8;margin-left:4px}
.tab[aria-selected=true]{color:#0a0f1e;font-weight:600}
.tabs .ind{position:absolute;z-index:0;top:0;bottom:0;width:calc(100%/3);left:0;background:linear-gradient(135deg,var(--brass),var(--gold2) 50%,var(--gold));transition:transform .45s cubic-bezier(.6,.05,.2,1)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 92%,transparent)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px 5px;border-radius:999px;font-size:.78rem;cursor:pointer;white-space:nowrap;transition:background .25s,border-color .25s,color .25s,box-shadow .25s}
.chip .n{color:var(--brass);margin-left:5px;font-size:.72rem}
.chip:hover{border-color:var(--gold)}
.chip[aria-pressed=true]{background:rgba(212,175,55,.16);border-color:var(--gold);color:var(--gold2);box-shadow:0 0 12px rgba(212,175,55,.2)}
.chip.star[aria-pressed=true]{background:var(--gold);color:#0a0f1e}
.chip.star[aria-pressed=true] .n{color:#3a2d08}
.chip[disabled]{opacity:.35;cursor:default}

/* ---------- Content ---------- */
main{padding:6px 14px 60px}
.result{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:14px 2px 4px}
.result b{color:var(--gold2);font-weight:600}
.sec{margin-top:22px}
.sec-h{display:flex;align-items:center;gap:12px;margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:1.35rem;color:var(--gold2);letter-spacing:.06em}
.sec-h .fan{width:34px;height:18px;flex:0 0 auto}
.sec-h::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold),transparent)}
.sec-h small{font-family:var(--body);font-size:.72rem;color:var(--brass);letter-spacing:.15em}
.sec-h .tag{font-family:var(--body);font-size:.62rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 6px 2px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)} main{padding:6px 22px 70px}.bar{padding-left:22px;padding-right:22px}}
@media (min-width:1020px){.grid{grid-template-columns:repeat(3,1fr)}}

.card{position:relative;background:linear-gradient(160deg,var(--panel2),var(--panel) 60%,#0b1226);border:1px solid rgba(212,175,55,.22);border-radius:var(--r);overflow:hidden;
  opacity:0;animation:cardIn .6s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:calc(var(--i,0) * 45ms);
  transition:border-color .3s,box-shadow .3s,transform .3s}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid var(--gold);opacity:.55;pointer-events:none;z-index:2;transition:opacity .3s,width .3s,height .3s}
.card::before{top:5px;left:5px;border-right:0;border-bottom:0}
.card::after{bottom:5px;right:5px;border-left:0;border-top:0}
@media (hover:hover){.card:hover{border-color:rgba(212,175,55,.7);box-shadow:0 0 0 1px rgba(212,175,55,.25),0 10px 34px rgba(0,0,0,.5),0 0 28px rgba(212,175,55,.18);transform:translateY(-2px)}
  .card:hover::before,.card:hover::after{opacity:1;width:22px;height:22px}}
.card.full{grid-column:1/-1}
@media (min-width:640px){.card.full{grid-column:span 2}}
@media (min-width:1020px){.card.full{grid-column:span 1}}
.photo{position:relative;aspect-ratio:4/3;overflow:hidden;background:#000;border-bottom:1px solid var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform 1.2s ease}
@media (hover:hover){.card:hover .photo img{transform:scale(1.05)}}
.photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(7,11,22,.85));pointer-events:none}
.photo .ribbon{position:absolute;left:12px;bottom:10px;z-index:1;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:#0a0f1e;background:var(--gold);padding:4px 8px 3px}
.row{display:flex;gap:13px;align-items:center;padding:14px 14px 13px}
.medal{flex:0 0 auto;width:58px;height:58px}
.medal svg{width:100%;height:100%;display:block}
.info{min-width:0;flex:1}
.name{margin:0;font-family:var(--display);font-weight:400;font-size:1.22rem;line-height:1.15;color:var(--ink);letter-spacing:.02em}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:5px;font-size:.82rem}
.author{color:var(--brass)}
.ig{display:inline-flex;align-items:center;gap:5px;color:var(--gold2);text-decoration:none;border-bottom:1px solid transparent;transition:border-color .25s,text-shadow .25s;padding:3px 0}
.ig:hover,.ig:focus-visible{border-bottom-color:var(--gold);text-shadow:0 0 10px rgba(243,217,139,.6)}
.ig svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6}
.sg{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.nota{margin:0 14px 13px;padding:8px 11px 7px;border-left:2px solid var(--gold);background:rgba(212,175,55,.06);font-size:.86rem;color:#d9d1bb}
.nota b{font-weight:600;color:var(--gold2);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;margin-right:6px}
.toggle{display:flex;width:100%;align-items:center;justify-content:center;gap:10px;background:rgba(212,175,55,.07);border:0;border-top:1px solid var(--line);padding:11px;cursor:pointer;font-size:.75rem;letter-spacing:.25em;text-transform:uppercase;color:var(--gold2);transition:background .25s}
.toggle:hover{background:rgba(212,175,55,.14)}
.toggle .chev{width:10px;height:10px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .4s}
.card.open .toggle .chev{transform:rotate(-135deg) translateY(-2px)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.4,0,.2,1)}
.card.open .body{grid-template-rows:1fr}
.body > div{overflow:hidden}
.recipe{padding:4px 16px 16px;opacity:0;transform:translateY(-6px);transition:opacity .4s .1s,transform .4s .1s}
.card.open .recipe{opacity:1;transform:none}
.recipe h4{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-family:var(--display);font-weight:400;font-size:1.1rem;color:var(--gold);letter-spacing:.12em;text-transform:uppercase}
.recipe h4::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.ing{list-style:none;margin:0;padding:0}
.ing li{position:relative;padding:5px 0 5px 20px;border-bottom:1px dashed rgba(212,175,55,.14);font-size:.95rem}
.ing li::before{content:"";position:absolute;left:3px;top:.8em;width:6px;height:6px;border:1px solid var(--gold);transform:rotate(45deg)}
.pasos{list-style:none;counter-reset:p;margin:0;padding:0}
.pasos li{counter-increment:p;position:relative;padding:6px 0 8px 40px;font-size:.95rem}
.pasos li::before{content:counter(p);position:absolute;left:0;top:4px;width:27px;height:27px;display:grid;place-items:center;font-family:var(--display);font-size:1rem;color:var(--gold2);border:1px solid var(--gold);transform:rotate(45deg)}
.pasos li::after{content:counter(p);position:absolute;left:0;top:4px;width:27px;height:27px;display:grid;place-items:center;font-family:var(--display);font-size:.95rem;color:var(--gold2)}
.pasos li::before{content:""}
.fuente{margin:14px 0 0;font-size:.76rem;color:var(--muted);font-style:italic;border-top:1px solid rgba(212,175,55,.15);padding-top:9px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty svg{width:110px;height:60px;display:block;margin:0 auto 14px}
.empty p{font-family:var(--display);font-size:1.4rem;color:var(--gold2);margin:0 0 6px}
mark{background:rgba(212,175,55,.3);color:inherit;border-radius:2px;padding:0 1px}
footer{text-align:center;padding:26px 16px 40px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);border-top:1px solid var(--line)}
.top{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;width:46px;height:46px;border:1px solid var(--gold);background:rgba(7,11,22,.9);transform:rotate(45deg) scale(.6);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;cursor:pointer}
.top.show{opacity:1;pointer-events:auto;transform:rotate(45deg) scale(1)}
.top span{display:block;width:12px;height:12px;border-left:1.5px solid var(--gold2);border-top:1.5px solid var(--gold2);margin:4px 0 0 4px}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;animation-delay:0s!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
  .sun svg{animation:none}
  .card{opacity:1}
}
</style>
</head>
<body>
<header class="hero">
  <div class="sun" aria-hidden="true"><svg viewBox="-100 -100 200 200" id="sunburst"></svg></div>
  <svg class="crest" viewBox="0 0 74 46" aria-hidden="true">
    <path d="M2 44 A35 35 0 0 1 72 44"/><path d="M14 44 A23 23 0 0 1 60 44"/><path d="M26 44 A11 11 0 0 1 48 44"/>
    <line x1="37" y1="44" x2="37" y2="2"/><line x1="37" y1="44" x2="12" y2="12"/><line x1="37" y1="44" x2="62" y2="12"/><line x1="37" y1="44" x2="3" y2="30"/><line x1="37" y1="44" x2="71" y2="30"/>
  </svg>
  <h1>Mis Recetas</h1>
  <p class="sub">El recetario de Alan</p>
  <div class="rule" aria-hidden="true"><i></i></div>
  <div class="stats" id="stats"></div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search" id="searchBox">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
      <label for="q" class="sr">Buscar recetas</label>
      <input id="q" type="search" placeholder="Receta, @autor o ingrediente…" autocomplete="off" enterkeyhint="search">
      <button class="clear" id="clear" aria-label="Borrar búsqueda">×</button>
    </div>
    <div class="tabs" role="tablist" id="tabs">
      <span class="ind" id="ind"></span>
      <button class="tab" role="tab" data-g="todas" aria-selected="true">Todas<span class="n"></span></button>
      <button class="tab" role="tab" data-g="dulce" aria-selected="false">Dulces<span class="n"></span></button>
      <button class="tab" role="tab" data-g="salada" aria-selected="false">Saladas<span class="n"></span></button>
    </div>
    <div class="chips" id="chips" aria-label="Subgrupos"></div>
  </div>
</div>

<main class="wrap">
  <div class="result" id="result" aria-live="polite"></div>
  <div id="list"></div>
</main>
<footer>Recetas guardadas de Instagram · hecho para Alan</footer>
<button class="top" id="top" aria-label="Volver arriba"><span></span></button>

  {"id": "DZ3crhNxgzk", "nombre": "Torta mágica de limón", "autor": "@reposteria.linee", "grupo": "dulce", "subgrupo": "Tortas y budines", "ingredientes": ["1 litro de leche entera", "4 huevos grandes", "150 g de azúcar", "50 a 70 g de harina común", "Cáscara de ½ limón y 1 rama de canela (o esencia de vainilla)"], "pasos": ["Calentar la leche con la cáscara de limón y la canela; cuando humee, retirar, tapar y dejar reposar 15 min.", "Separar claras y yemas. Batir las yemas con el azúcar hasta que blanqueen e incorporar la harina sin grumos.", "Retirar el limón y la canela de la leche tibia y agregarla de a poco a las yemas, batiendo suave.", "Batir las claras a punto nieve e incorporarlas con movimientos envolventes.", "Volcar en un molde enmantecado y hornear a 170 °C, 45–55 min (dorada arriba y el centro apenas tembloroso).", "Enfriar a temperatura ambiente y llevar a la heladera 3–6 h antes de servir."], "fuente": "comentario de @nella_murgolo (no de la autora). La publicación original de @reposteria.linee no trae cantidades; las cantidades son del comentario."},

  {"id": "DbZF-xbyHiG", "nombre": "Kuchen alemán de frambuesas", "autor": "@lacocina_depaula", "grupo": "dulce", "subgrupo": "Postres fríos y cheesecakes", "ingredientes": ["Masa: 300 g de harina, 100 g de azúcar, 150 g de manteca fría, 1 huevo, 5 g de polvo de hornear, 1 pizca de sal", "Relleno: 500 g de queso crema, 400 ml de crema de leche, 120 g de azúcar, 1 cdita de esencia de vainilla, 3 huevos, 30 g de maicena", "Además: 250–300 g de frambuesas y 1 cda de maicena"], "pasos": ["Mezclar la harina, el azúcar, el polvo de hornear y la sal. Sumar la manteca fría en cubos y arenar. Agregar el huevo y unir apenas hasta formar una masa. Reservar un puñado y mezclarlo con 2 cdas de harina para el crumble.", "Forrar un molde de 30 cm con papel manteca y cubrir la base y los bordes con la masa.", "Mezclar las frambuesas con 1 cda de maicena.", "Relleno: batir el queso crema hasta que esté cremoso; sumar el azúcar y luego los huevos de a uno. Incorporar la crema, la vainilla y por último la maicena, mezclando solo hasta integrar.", "Volcar el relleno sobre la masa, repartir las frambuesas y terminar con el crumble.", "Hornear a 175 °C (calor arriba y abajo) durante 70 min.", "Dejar enfriar por completo y llevar a la heladera toda la noche antes de desmoldar y cortar."], "fuente": "descripción de @lacocina_depaula"},

  {"id": "DVJ49hkEYyD", "nombre": "Tarta de cebolla y hongos", "autor": "@recetasdepilu", "grupo": "salada", "subgrupo": "Tartas y quiches", "ingredientes": ["1 tapa de tarta (comprada o casera)", "2 cebollas grandes", "300 g de hongos (champiñones o portobellos)", "100 g de jamón", "100 ml de crema de leche", "2 huevos", "250 g de queso cremoso o mozzarella", "Pimentón, nuez moscada, pimienta y sal a gusto"], "pasos": ["Limpiar los hongos con papel (sin lavarlos) y cortarlos.", "Rehogar la cebolla en juliana con sal en una sartén.", "Sumar los hongos y cocinar hasta que se doren; condimentar con pimentón, nuez moscada, pimienta y sal.", "Batir la crema con los huevos.", "Forrar una tartera con la tapa; distribuir la cebolla con hongos y el jamón, volcar la mezcla de crema y huevos y cubrir con el queso.", "Hornear a 180 °C (horno medio) hasta que esté bien dorada."], "fuente": "descripción y video de @recetasdepilu"},

  {"id": "DcY1Hh2xfPT", "nombre": "Mac & cheese de cebolla a la francesa en una sola sartén", "autor": "@badbatchbaking", "grupo": "salada", "subgrupo": "Pastas y ñoquis", "ingredientes": ["5 fetas de panceta (reservar la grasa)", "1 cebolla grande en juliana fina (o 1½ medianas)", "½ cdita de sal fina", "2 cdas de manteca con sal", "3 dientes de ajo picados", "2 tazas de pasta ditalini seca (o coditos chicos)", "3 tazas de caldo de carne bajo en sodio", "½ taza de crema de leche", "½ cdita de pimienta negra recién molida", "170 g de queso gruyère recién rallado", "170 g de queso cheddar fuerte recién rallado"], "pasos": ["Dorar la panceta en una sartén grande a fuego medio-bajo hasta que esté crocante; escurrir sobre papel y picar. Dejar 2 cdas de grasa en la sartén.", "Agregar la cebolla y la sal; cocinar ~15 min a fuego medio-bajo, revolviendo seguido, hasta que esté muy tierna y bien dorada (sumar chorritos de agua si hace falta).", "Correr la cebolla a un costado, derretir la manteca y saltear el ajo ~1 min.", "Agregar la pasta y el caldo; llevar a hervor, tapar y cocinar a fuego suave ~10 min, hasta que la pasta esté tierna.", "Destapar y revolver (casi todo el caldo tiene que estar absorbido). Sumar la crema y la pimienta a fuego medio-bajo.", "Agregar el gruyère y el cheddar y revolver suave hasta que se fundan (que no hierva).", "Retirar del fuego, cubrir con la panceta, dejar reposar unos minutos para que espese y servir caliente."], "fuente": "web de @badbatchbaking (badbatchbaking.com), traducida del inglés · 6 porciones"},

  {"id": "DZ5c8wQBW9X", "nombre": "Chips de aros de cebolla y queso", "autor": "@come.vive.viaja", "grupo": "salada", "subgrupo": "Verduras y acompañamientos", "ingredientes": ["2 cebollas blancas en rodajas finas", "200 g de queso parmesano rallado (tipo Grana Padano)", "1 cda de aceite de oliva extra virgen", "Sal, ajo en polvo, orégano y pimentón a gusto"], "pasos": ["Precalentar el horno a 200 °C y forrar una placa con papel manteca.", "Espolvorear el queso formando una capa fina y pareja.", "Acomodar los aros de cebolla encima, uno al lado del otro, sin superponerlos.", "Pincelar las cebollas con el aceite de oliva y condimentar con sal, ajo en polvo, pimentón y orégano.", "Hornear 18 min o hasta que esté dorado.", "Dejar enfriar 5–10 min y cortar para servir."], "fuente": "descripción de @come.vive.viaja"},

<script>
(function(){
"use strict";
var RECETAS = JSON.parse(document.getElementById('recetas-data').textContent);
var FOTOS = JSON.parse(document.getElementById('fotos-data').textContent || '{}');
var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Orden de subgrupos según aparición */
var ORDER = {dulce:[], salada:[]};
RECETAS.forEach(function(r){ var o = ORDER[r.grupo] || (ORDER[r.grupo]=[]); if (o.indexOf(r.subgrupo) < 0) o.push(r.subgrupo); });

function norm(s){ return (s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
RECETAS.forEach(function(r){
  r._hay = norm([r.nombre, r.autor, (r.ingredientes||[]).join(' '), r.nota||''].join(' | '));
  r._full = !!(r.pasos && r.pasos.length);
});

/* Sunburst del encabezado */
(function(){
  var s = document.getElementById('sunburst'), h = '';
  for (var i=0;i<72;i++){ var a=i*5*Math.PI/180, r1=(i%2? 30:22), r2=(i%3? 92:99);
    h += '<line x1="'+(Math.cos(a)*r1).toFixed(2)+'" y1="'+(Math.sin(a)*r1).toFixed(2)+'" x2="'+(Math.cos(a)*r2).toFixed(2)+'" y2="'+(Math.sin(a)*r2).toFixed(2)+'" stroke="#d4af37" stroke-opacity="'+(i%2?.25:.5)+'" stroke-width="'+(i%2?.25:.4)+'"/>'; }
  [20,40,60].forEach(function(r){ h += '<circle r="'+r+'" fill="none" stroke="#d4af37" stroke-opacity=".3" stroke-width=".3"/>'; });
  s.innerHTML = h;
})();

/* Paleta por subgrupo para los medallones */
var HUES = ['#d4af37','#c9a46a','#e0c27a','#b8925a','#d9b860','#c7a24a','#e6cf95','#b49660'];
function hueFor(r){ var o = ORDER[r.grupo]||[]; return HUES[(o.indexOf(r.subgrupo) + (r.grupo==='salada'?3:0)) % HUES.length]; }

/* Medallón Art Deco (abanico + inicial) para recetas sin foto */
function medal(r){
  var c = hueFor(r), ini = esc((r.nombre.replace(/^[^A-Za-zÁÉÍÓÚÑáéíóúñ0-9]+/,'')[0]||'·').toUpperCase());
  var rays = '';
  for (var i=0;i<=8;i++){ var a = Math.PI + i*Math.PI/8;
    rays += '<line x1="30" y1="44" x2="'+(30+Math.cos(a)*27).toFixed(1)+'" y2="'+(44+Math.sin(a)*27).toFixed(1)+'"/>'; }
  var motif = r.grupo==='dulce'
    ? '<g stroke="'+c+'" stroke-width=".7" opacity=".55">'+rays+'</g><path d="M3 44A27 27 0 0 1 57 44" fill="none" stroke="'+c+'" stroke-width="1"/>'
    : '<g fill="none" stroke="'+c+'" stroke-width=".8" opacity=".6"><path d="M30 6L54 30L30 54L6 30Z"/><path d="M30 14L46 30L30 46L14 30Z"/></g>';
  return '<svg viewBox="0 0 60 60" aria-hidden="true"><rect x=".5" y=".5" width="59" height="59" fill="#0a1124" stroke="'+c+'" stroke-opacity=".6"/>'
    + '<rect x="3.5" y="3.5" width="53" height="53" fill="none" stroke="'+c+'" stroke-opacity=".25"/>' + motif
    + '<circle cx="30" cy="'+(r.grupo==='dulce'?33:30)+'" r="12.5" fill="#0a1124" stroke="'+c+'" stroke-width=".9"/>'
    + '<text x="30" y="'+(r.grupo==='dulce'?39:36)+'" text-anchor="middle" font-family="Poiret One,Didot,Futura,serif" font-size="17" fill="'+c+'">'+ini+'</text></svg>';
}
var FAN = '<svg class="fan" viewBox="0 0 34 18" aria-hidden="true"><g fill="none" stroke="#d4af37" stroke-width="1"><path d="M1 17A16 16 0 0 1 33 17"/><path d="M8 17A9 9 0 0 1 26 17"/><line x1="17" y1="17" x2="17" y2="1"/><line x1="17" y1="17" x2="5.7" y2="5.7"/><line x1="17" y1="17" x2="28.3" y2="5.7"/></g></svg>';
var IG = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/></svg>';

function hl(text, q){
  var t = esc(text); if (!q) return t;
  var n = norm(text), out = '', i = 0, k;
  /* resaltado insensible a acentos (las longitudes coinciden para letras latinas comunes) */
  if (n.length !== text.length) return t;
  while ((k = n.indexOf(q, i)) >= 0){ out += esc(text.slice(i,k)) + '<mark>' + esc(text.slice(k,k+q.length)) + '</mark>'; i = k + q.length; }
  return out + esc(text.slice(i));
}

var state = { g:'todas', sub:null, full:false, q:'' };
var $ = function(id){ return document.getElementById(id); };

function matches(r, ignoreSub){
  if (state.g !== 'todas' && r.grupo !== state.g) return false;
  if (!ignoreSub && state.sub && r.subgrupo !== state.sub) return false;
  if (state.full && !r._full) return false;
  if (state.q){ var terms = state.q.split(/\s+/); for (var i=0;i<terms.length;i++) if (r._hay.indexOf(terms[i]) < 0) return false; }
  return true;
}

function card(r, i, q){
  var foto = FOTOS[r.id], h = '';
  h += '<article class="card'+(r._full?' full':'')+'" style="--i:'+Math.min(i,14)+'" data-id="'+esc(r.id)+'">';
  if (foto) h += '<div class="photo"><img src="'+foto+'" alt="'+esc(r.nombre)+'" loading="lazy" decoding="async"><span class="ribbon">Receta completa</span></div>';
  h += '<div class="row">' + (foto ? '' : '<div class="medal">'+medal(r)+'</div>');
  h += '<div class="info"><h3 class="name">'+hl(r.nombre,q)+'</h3><div class="meta"><span class="author">'+hl(r.autor,q)+'</span>'
     + '<a class="ig" href="https://www.instagram.com/p/'+encodeURIComponent(r.id)+'/" target="_blank" rel="noopener noreferrer">'+IG+'Ver en Instagram</a></div>'
     + '</div></div>';
  if (r.nota) h += '<p class="nota"><b>Apunte</b>'+hl(r.nota,q)+'</p>';
  if (r._full){
    var bid = 'b-'+r.id.replace(/[^\w-]/g,'');
    h += '<button class="toggle" aria-expanded="false" aria-controls="'+bid+'"><span class="lbl">Ver receta</span><span class="chev"></span></button>';
    h += '<div class="body" id="'+bid+'"><div><div class="recipe">';
    if (r.ingredientes && r.ingredientes.length) h += '<h4>Ingredientes</h4><ul class="ing">' + r.ingredientes.map(function(x){return '<li>'+hl(x,q)+'</li>';}).join('') + '</ul>';
    h += '<h4>Pasos</h4><ol class="pasos">' + r.pasos.map(function(x){return '<li>'+esc(x)+'</li>';}).join('') + '</ol>';
    if (r.fuente) h += '<p class="fuente">Fuente: '+esc(r.fuente)+'</p>';
    h += '</div></div></div>';
  }
  return h + '</article>';
}

function render(){
  var q = state.q, list = RECETAS.filter(function(r){ return matches(r); });
  /* contadores de pestañas (respetan búsqueda y filtro "completa") */
  var cnt = {todas:0,dulce:0,salada:0};
  RECETAS.forEach(function(r){ var okQ = (!state.full || r._full) && (!q || q.split(/\s+/).every(function(t){return r._hay.indexOf(t)>=0;}));
    if (okQ){ cnt.todas++; cnt[r.grupo]++; } });
  document.querySelectorAll('.tab').forEach(function(t){ t.querySelector('.n').textContent = '('+cnt[t.dataset.g]+')'; });
  renderChips();
  $('result').innerHTML = '<b>'+list.length+'</b> '+(list.length===1?'receta':'recetas') + (q||state.sub||state.full||state.g!=='todas' ? ' de '+RECETAS.length : '');
  if (!list.length){
    $('list').innerHTML = '<div class="empty">'+FAN.replace('class="fan"','')+'<p>Nada por acá</p>Probá con otra palabra o cambiá el filtro.</div>'; return;
  }
  var html = '', i = 0, groups = state.g==='todas' ? ['dulce','salada'] : [state.g];
  groups.forEach(function(g){
    (ORDER[g]||[]).forEach(function(sg){
      var items = list.filter(function(r){ return r.grupo===g && r.subgrupo===sg; });
      if (!items.length) return;
      html += '<section class="sec"><h2 class="sec-h">'+FAN+esc(sg)+' <small>'+items.length+'</small>'+(state.g==='todas'?'<span class="tag">'+(g==='dulce'?'Dulce':'Salada')+'</span>':'')+'</h2><div class="grid">';
      items.forEach(function(r){ html += card(r, i++, q); });
      html += '</div></section>';
    });
  });
  $('list').innerHTML = html;
}

function renderChips(){
  var subs = state.g==='todas' ? ORDER.dulce.concat(ORDER.salada) : (ORDER[state.g]||[]);
  var base = RECETAS.filter(function(r){ return matches(r, true); });
  var fullCount = RECETAS.filter(function(r){ return r._full && (state.g==='todas'||r.grupo===state.g); }).length;
  var h = '<button class="chip star" data-full="1" aria-pressed="'+state.full+'">★ Con receta<span class="n">'+fullCount+'</span></button>';
  h += '<button class="chip" data-sub="" aria-pressed="'+(!state.sub)+'">Todos<span class="n">'+base.length+'</span></button>';
  subs.forEach(function(s){ var n = base.filter(function(r){return r.subgrupo===s;}).length;
    if (!n && state.sub!==s) return;
    h += '<button class="chip" data-sub="'+esc(s)+'" aria-pressed="'+(state.sub===s)+'">'+esc(s)+'<span class="n">'+n+'</span></button>'; });
  $('chips').innerHTML = h;
}

/* Eventos */
var tmr;
$('q').addEventListener('input', function(e){
  $('searchBox').classList.toggle('has', !!e.target.value);
  clearTimeout(tmr); tmr = setTimeout(function(){ state.q = norm(e.target.value.trim()); render(); }, 120);
});
$('clear').addEventListener('click', function(){ $('q').value=''; $('searchBox').classList.remove('has'); state.q=''; render(); $('q').focus(); });
$('tabs').addEventListener('click', function(e){
  var t = e.target.closest('.tab'); if (!t) return;
  state.g = t.dataset.g; state.sub = null;
  document.querySelectorAll('.tab').forEach(function(x,i){ var on = x===t; x.setAttribute('aria-selected', on); if (on) $('ind').style.transform = 'translateX('+(i*100)+'%)'; });
  $('chips').scrollLeft = 0; render();
});
$('chips').addEventListener('click', function(e){
  var c = e.target.closest('.chip'); if (!c || c.disabled) return;
  if (c.dataset.full) state.full = !state.full; else state.sub = c.dataset.sub || null;
  render();
});
$('list').addEventListener('click', function(e){
  var b = e.target.closest('.toggle'); if (!b) return;
  var c = b.closest('.card'), open = !c.classList.contains('open');
  c.classList.toggle('open', open); b.setAttribute('aria-expanded', open);
  b.querySelector('.lbl').textContent = open ? 'Ocultar receta' : 'Ver receta';
  if (!open && c.getBoundingClientRect().top < 0) c.scrollIntoView({behavior: reduce?'auto':'smooth', block:'start'});
});
var topBtn = $('top');
window.addEventListener('scroll', function(){ topBtn.classList.toggle('show', scrollY > 700); }, {passive:true});
topBtn.addEventListener('click', function(){ scrollTo({top:0, behavior: reduce?'auto':'smooth'}); });

/* Estadísticas del encabezado */
var nd = RECETAS.filter(function(r){return r.grupo==='dulce';}).length;
$('stats').innerHTML = '<div><b>'+RECETAS.length+'</b>recetas</div><div><b>'+nd+'</b>dulces</div><div><b>'+(RECETAS.length-nd)+'</b>saladas</div>';

/* Abrir una receta por hash: mis-recetas.html#DZ3crhNxgzk */
render();
if (location.hash){ var el = document.querySelector('.card[data-id="'+CSS.escape(location.hash.slice(1))+'"]');
  if (el){ var tg = el.querySelector('.toggle'); if (tg) tg.click(); el.scrollIntoView(); } }
})();
</script>
</body>
</html>
